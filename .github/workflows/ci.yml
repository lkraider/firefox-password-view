name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  ZIG_VERSION: "0.16.0"

jobs:
  build-and-test:
    # The oracle test in core/test/oracle.zig links libsqlite3 through the
    # macOS SDK stub, and the macOS app needs Swift. Package.swift's
    # swift-tools-version asks for Swift 6. macos-15's default Xcode ships
    # Swift 6. macos-14's default Xcode ships Swift 5.10.
    runs-on: macos-15

    outputs:
      win_x86_64: ${{ steps.cross.outputs.x86_64_windows_gnu }}
      win_arm64: ${{ steps.cross.outputs.aarch64_windows_gnu }}

    steps:
      - uses: actions/checkout@v7

      - name: Cache the pinned Zig toolchain
        id: zig-cache
        uses: actions/cache@v6
        with:
          path: zig/zig-aarch64-macos-${{ env.ZIG_VERSION }}
          key: zig-aarch64-macos-${{ env.ZIG_VERSION }}

      - name: Install the pinned Zig toolchain
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p zig
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          tar -xf zig.tar.xz -C zig
          rm zig.tar.xz

      # One invocation, so the build runner schedules both step trees at once
      # against one cache. Debug here, and windows-test runs the same suite at
      # ReleaseSafe.
      - name: zig build test smoke
        run: ./zig/zig-aarch64-macos-${ZIG_VERSION}/zig build test smoke

      - name: Build the Zig core (release, for the macOS app to link)
        run: ./zig/zig-aarch64-macos-${ZIG_VERSION}/zig build -Doptimize=ReleaseSafe

      - name: swift test
        working-directory: macos
        run: swift test -Xswiftc -F -Xswiftc /Library/Developer/CommandLineTools/Library/Developer/Frameworks

      - name: Bundle the macOS app (release)
        working-directory: macos
        run: ./scripts/bundle.sh

      - name: Cross-compile every shipped target
        id: cross
        # ReleaseSafe matches scripts/package-release.sh, so this step compiles
        # the same source with the same flags that script uses.
        #
        # The three targets build at once. Each gets its own cache directory and
        # its own prefix, so no build reads another's artifacts and one output
        # file per build holds its log. Two parallel builds and one sequential
        # build of x86_64-windows-gnu produced the same sum on a development
        # Mac, so the extra flags change no byte of the exe.
        #
        # Each Windows exe's sum goes in the run summary, beside the ones the
        # two Windows jobs record. scripts/package-release.sh cross-compiles
        # from this host with these flags, so a released zip holds these bytes.
        run: |
          targets="x86_64-windows-gnu aarch64-windows-gnu x86_64-linux-musl"
          jobs=""
          for target in $targets; do
            ./zig/zig-aarch64-macos-${ZIG_VERSION}/zig build \
              -Dtarget="$target" -Doptimize=ReleaseSafe \
              --cache-dir ".zig-cache-$target" -p "out-$target" \
              > "build-$target.log" 2>&1 &
            jobs="$jobs $!:$target"
          done

          status=0
          for job in $jobs; do
            wait "${job%%:*}" || status=1
            echo "--- ${job#*:}"
            cat "build-${job#*:}.log"
          done
          [ "$status" -eq 0 ] || exit 1

          for target in x86_64-windows-gnu aarch64-windows-gnu; do
            sum=$(shasum -a 256 "out-$target/bin/FirefoxPasswordView.exe" | cut -d' ' -f1)
            echo "sha256 $sum  $target  built on macOS ARM64"
            echo "- \`$target\` built on \`macOS ARM64\`, the host that builds a release: \`$sum\`" \
              >> "$GITHUB_STEP_SUMMARY"
            echo "$(echo "$target" | tr - _)=$sum" >> "$GITHUB_OUTPUT"
          done

  windows-test:
    # Runs the core tests and builds the app on the platform it ships for.
    # -Doracle=false drops the differential test, since a Windows runner has
    # no sqlite3 development install.
    runs-on: windows-latest

    outputs:
      sum: ${{ steps.build.outputs.sum }}

    steps:
      - uses: actions/checkout@v7

      - name: Cache the pinned Zig toolchain
        id: zig-cache
        uses: actions/cache@v6
        with:
          path: zig/zig-x86_64-windows-${{ env.ZIG_VERSION }}
          key: zig-x86_64-windows-${{ env.ZIG_VERSION }}

      - name: Install the pinned Zig toolchain
        if: steps.zig-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path zig | Out-Null
          Invoke-WebRequest -Uri "https://ziglang.org/download/$env:ZIG_VERSION/zig-x86_64-windows-$env:ZIG_VERSION.zip" -OutFile zig.zip
          Expand-Archive -Path zig.zip -DestinationPath zig
          Remove-Item zig.zip

      # Three zig processes at once: two builds of the exe and the test suite.
      # Measured on a development Mac: 19 seconds of wall clock for 76 of cpu.
      #
      # The tests run at ReleaseSafe, which scripts/package-release.sh builds
      # with. Measured on Zig 0.16.0: ReleaseSafe fills undefined memory with
      # 0xAA, as Debug does, and keeps the bounds, overflow and alignment
      # checks. It also runs the optimizer, so this step tests the code
      # generation of a released exe. build-and-test runs the suite in Debug.
      - name: Test and build the app twice, in parallel
        id: build
        shell: pwsh
        run: >
          .\scripts\win-build-hash.ps1
          -Zig .\zig\zig-x86_64-windows-${{ env.ZIG_VERSION }}\zig.exe
          -Target x86_64-windows-gnu -Twice -WithTests

      - name: Launch the app against the fresh fixture
        shell: pwsh
        run: .\scripts\win-launch-check.ps1

  windows-arm-test:
    # Runs the arm64 exe the release ships. windows-latest above is x86_64, and
    # the wine rig on a development Mac is x86_64 under Rosetta 2, so neither
    # can load an ARM64 PE.
    #
    # This job drives the x86_64 toolchain under Windows-on-ARM emulation and
    # cross-compiles, the way scripts/package-release.sh cross-compiles from
    # macOS. Zig 0.16.0's own aarch64-windows build answers `zig version` and
    # `zig env`, then dies on `zig build` with exit -1073741819, an access
    # violation, and prints nothing. `zig build test` therefore runs on
    # windows-latest and on macos-15, and this job builds and launches.
    runs-on: windows-11-arm

    outputs:
      sum: ${{ steps.build.outputs.sum }}

    steps:
      - uses: actions/checkout@v7

      # The same cache entry windows-test fills. One download serves both.
      - name: Cache the pinned Zig toolchain
        id: zig-cache
        uses: actions/cache@v6
        with:
          path: zig/zig-x86_64-windows-${{ env.ZIG_VERSION }}
          key: zig-x86_64-windows-${{ env.ZIG_VERSION }}

      - name: Install the pinned Zig toolchain
        if: steps.zig-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path zig | Out-Null
          Invoke-WebRequest -Uri "https://ziglang.org/download/$env:ZIG_VERSION/zig-x86_64-windows-$env:ZIG_VERSION.zip" -OutFile zig.zip
          Expand-Archive -Path zig.zip -DestinationPath zig
          Remove-Item zig.zip

      # One build. The emulated compiler took 192 seconds for it, and
      # windows-test above already builds twice against the same toolchain.
      - name: Cross-compile the arm64 app and record its sum
        id: build
        shell: pwsh
        run: >
          .\scripts\win-build-hash.ps1
          -Zig .\zig\zig-x86_64-windows-${{ env.ZIG_VERSION }}\zig.exe
          -Target aarch64-windows-gnu

      - name: Launch the arm64 app against the fresh fixture
        shell: pwsh
        run: .\scripts\win-launch-check.ps1

  compare-sums:
    # Asserts that every build host produced the same exe. The three jobs above
    # publish one sum per target, and `needs` holds this job until each one has
    # finished. Nothing here builds, so the runner that starts fastest runs it.
    needs: [build-and-test, windows-test, windows-arm-test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: x86_64-windows-gnu, from macos-15 and windows-latest
        run: >
          scripts/compare-sums.sh x86_64-windows-gnu
          "macos-15=${{ needs.build-and-test.outputs.win_x86_64 }}"
          "windows-latest=${{ needs.windows-test.outputs.sum }}"

      - name: aarch64-windows-gnu, from macos-15 and windows-11-arm
        run: >
          scripts/compare-sums.sh aarch64-windows-gnu
          "macos-15=${{ needs.build-and-test.outputs.win_arm64 }}"
          "windows-11-arm=${{ needs.windows-arm-test.outputs.sum }}"

  reproducible-build:
    # Packages the release artifacts twice from a clean state and diffs
    # them. This catches a regression in build.zig's strip, bundle.sh's
    # -gnone, or the tar/ditto flags in scripts/package-release.sh. Each
    # of those exists to keep this build byte-for-byte reproducible.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7

      - name: Cache the pinned Zig toolchain
        id: zig-cache
        uses: actions/cache@v6
        with:
          path: zig/zig-aarch64-macos-${{ env.ZIG_VERSION }}
          key: zig-aarch64-macos-${{ env.ZIG_VERSION }}

      - name: Install the pinned Zig toolchain
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p zig
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          tar -xf zig.tar.xz -C zig
          rm zig.tar.xz

      - name: Package once
        run: ./scripts/package-release.sh 0.0.0-repro-check dist1

      - name: Clean every build artifact
        # package-release.sh gives each Windows build its own cache and prefix.
        run: rm -rf .zig-cache zig-out macos/.build .zig-cache-x86_64 .zig-cache-arm64 out-x86_64 out-arm64

      - name: Package again
        run: ./scripts/package-release.sh 0.0.0-repro-check dist2

      - name: Compare
        run: |
          echo "--- run 1 ---"
          (cd dist1 && shasum -a 256 * | sort)
          echo "--- run 2 ---"
          (cd dist2 && shasum -a 256 * | sort)
          diff <(cd dist1 && shasum -a 256 * | sort) <(cd dist2 && shasum -a 256 * | sort) \
            && echo "reproducible: both packaging runs match byte for byte"
