name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  ZIG_VERSION: "0.16.0"

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache the pinned Zig toolchain
        id: zig-cache
        uses: actions/cache@v4
        with:
          path: zig/zig-aarch64-macos-${{ env.ZIG_VERSION }}
          key: zig-aarch64-macos-${{ env.ZIG_VERSION }}

      - name: Install the pinned Zig toolchain
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p zig
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz" -o zig.tar.xz
          tar -xf zig.tar.xz -C zig
          rm zig.tar.xz

      - name: Build the Zig core and the TUI (release)
        run: ./zig/zig-aarch64-macos-${ZIG_VERSION}/zig build -Doptimize=ReleaseSafe

      - name: Package the TUI binary
        run: |
          mkdir -p dist
          # Plain `tar -czf` embeds gzip's own compress-time timestamp, so
          # the tarball differs byte for byte between two builds of an
          # identical binary. `tar` with normalized ownership, piped through
          # `gzip -n` (no name/timestamp in the gzip header), doesn't;
          # verified locally: two such tarballs of the same input match.
          touch -t 202601010000 zig-out/bin/ffpw
          tar --numeric-owner --uid 0 --gid 0 -cf - -C zig-out/bin ffpw | gzip -n -9 > dist/ffpw-aarch64-macos.tar.gz

      - name: Bundle and package the macOS app
        working-directory: macos
        run: |
          ./scripts/bundle.sh release
          mkdir -p ../dist
          version="${GITHUB_REF_NAME#v}"
          # No --sequesterRsrc: it moves resource-fork/metadata sidecar
          # files into a __MACOSX/ directory whose own entries ditto stamps
          # with the current wall-clock time rather than the source files',
          # which this app has no need to preserve anyway.
          ditto -c -k --keepParent \
            .build/release/FirefoxPasswordView.app \
            "../dist/FirefoxPasswordView-${version}-macos.zip"

      - name: Checksums
        working-directory: dist
        run: shasum -a 256 * | tee SHA256SUMS

      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
